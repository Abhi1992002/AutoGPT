; Process manager for the AutoGPT Desktop backend container. Every program logs to the
; container's stdout, so `docker logs` shows everything.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql
user=postgres
priority=10
; SIGINT is PostgreSQL's fast shutdown
stopsignal=INT
stopwaitsecs=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:valkey]
command=valkey-server --bind 127.0.0.1 --port 6379 --protected-mode no --dir /data/valkey --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf
user=valkey
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbitmq]
command=/usr/lib/rabbitmq/bin/rabbitmq-server
user=rabbitmq
priority=10
; A fixed node name keeps the data directory stable when the container is recreated
environment=HOME="/data/rabbitmq",RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_MNESIA_BASE="/data/rabbitmq/mnesia",RABBITMQ_LOGS="-",RABBITMQ_NODE_IP_ADDRESS="127.0.0.1",ERL_EPMD_ADDRESS="127.0.0.1"
stopwaitsecs=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=/opt/autogpt-desktop/start-backend.sh
priority=50
startsecs=0
startretries=5
; `app` runs each backend service as a child process
stopasgroup=true
killasgroup=true
stopwaitsecs=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
