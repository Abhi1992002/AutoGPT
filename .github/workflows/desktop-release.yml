name: Desktop Release

# Builds a universal macOS AutoGPT Desktop and publishes it as a GitHub Release. Started by hand from
# the Actions tab. The installed app reads latest.json from the newest release to offer the update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must be higher than the last release)"
        required: true
        type: string
      notes:
        description: "Release notes (shown on the release page and in the app's update dialog)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: autogpt_platform/desktop
    steps:
      - name: Check version
        working-directory: .
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.2.0, got '$VERSION'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: autogpt_platform/desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: autogpt_platform/desktop/src-tauri -> target

      - name: Set version to ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          # The first `version = ` line in Cargo.toml is the [package] one
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml
          jq -r .version src-tauri/tauri.conf.json package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: autogpt_platform/desktop
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin
          tagName: desktop-v${{ inputs.version }}
          releaseName: AutoGPT Desktop v${{ inputs.version }}
          # Also becomes `notes` in latest.json
          releaseBody: ${{ inputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          uploadUpdaterJson: true
